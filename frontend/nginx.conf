server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # API e documentação servidas pelo backend na mesma origem (cookie de sessão e CSRF).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
